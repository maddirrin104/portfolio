name: Deploy Astro Portfolio

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:

  # ===================================
  # CI - BUILD WEBSITE
  # ===================================

  build:
    name: Build Astro
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build Astro
        run: npm run build

      - name: Verify build
        run: |
          node scripts/verify-build.mjs
          test -s dist/index.html

      - name: Create artifact checksums
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS

      - name: Smoke test release switching
        run: bash tests/deploy-smoke.sh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ===================================
  # CD - DEPLOY WEBSITE
  # ===================================

  deploy:
    name: Deploy to Ubuntu
    needs: build

    runs-on:
      - self-hosted
      - linux
      - x64
      - portfolio-deploy

    environment: production

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: ${{ runner.temp }}/portfolio-dist

      - name: Deploy new release
        shell: bash
        run: bash scripts/deploy-release.sh "$RUNNER_TEMP/portfolio-dist" /var/www/portfolio "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
